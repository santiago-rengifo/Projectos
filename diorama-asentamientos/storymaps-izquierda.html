<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diorama 3D · Fichas de asentamientos a la izquierda · StoryMaps</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1f2933;
    background: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #eef1f4 55%, #dde3e9 100%);
  }
  body.bg-transparent { background: transparent; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; touch-action: none; }

  #cabecera {
    position: absolute; top: 0; left: 0; right: 0; padding: 10px 12px 8px;
    text-align: center; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,.92) 0%, rgba(255,255,255,.75) 75%, rgba(255,255,255,0) 100%);
  }
  #cabecera > * { max-width: 760px; margin-left: auto; margin-right: auto; }
  body.bg-transparent #cabecera { background: none; }
  #cabecera h1 { font-size: 22px; margin: 0 auto; line-height: 1.2; text-shadow: 0 1px 2px rgba(255,255,255,.9); }
  #cabecera .sub { color: #3e4c59; font-size: 13px; margin-top: 2px; text-shadow: 0 1px 2px rgba(255,255,255,.9); }
  #cabecera .meta { color: #52606d; font-size: 11px; margin-top: 3px; text-shadow: 0 1px 2px rgba(255,255,255,.9); }
  #cabecera #chips { margin-top: 1px; }
  #cabecera .chip { margin: 4px 2px 0; }

  #galeria {
    position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px;
    overflow-x: auto; padding: 8px 14px 24px;
    background: rgba(255,255,255,.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-top: 1px solid rgba(15,23,42,.08); scroll-snap-type: x proximity; justify-content: safe center;
    scrollbar-width: thin;
  }
  .tn {
    flex: 0 0 auto; width: 92px; border: 0; background: transparent; cursor: pointer; padding: 4px 2px;
    font: inherit; color: #1f2933; scroll-snap-align: center; border-radius: 10px; transition: background .15s;
  }
  .tn:hover { background: rgba(255,255,255,.6); }
  .tn canvas {
    width: 70px; height: 70px; border-radius: 50%; display: block; margin: 0 auto 4px;
    background: #cfd6dd; box-shadow: 0 1px 4px rgba(0,0,0,.25); border: 3px solid #fff; box-sizing: content-box;
  }
  .tn.activo canvas { border-color: #d64545; }
  .tn.activo span { font-weight: 700; }
  .tn span {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 11px; line-height: 1.25; text-align: center;
  }
  .tn small { display: block; font-size: 10px; color: #616e7c; text-align: center; }

  .panel {
    position: absolute; top: 110px; left: 12px; max-width: 260px;
    background: rgba(255,255,255,.93); border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 2px 12px rgba(15,23,42,.14); font-size: 13px; line-height: 1.4;
  }
  .panel .coords { font-variant-numeric: tabular-nums; color: #3e4c59; font-size: 12px; }
  .panel .meta { color: #52606d; font-size: 12px; margin-top: 4px; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; margin: 6px 4px 0 0; }
  .chip.warn { background: #fff4e0; color: #8a5300; border: 1px solid #f5c26b; }
  .chip.bad { background: #fde8e8; color: #9b1c1c; border: 1px solid #f3a5a5; }
  .chip.ok { background: #e6f6ec; color: #1e6b3a; border: 1px solid #9fd8b2; }
  .obs { margin-top: 8px; font-size: 12px; color: #3e4c59; }
  .obs summary { cursor: pointer; color: #1f5f99; }
  .ctrl { margin-top: 10px; display: grid; gap: 8px; }
  .ctrl label { font-size: 12px; color: #3e4c59; display: grid; gap: 3px; }
  .ctrl select, .ctrl input[type=range] { width: 100%; }
  .ctrl select { font: inherit; padding: 4px; border-radius: 6px; border: 1px solid #cbd2d9; background: #fff; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btns button {
    font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px;
    border: 1px solid #cbd2d9; background: #fff; cursor: pointer;
  }
  .btns button:hover { background: #f0f4f8; }

  .attr {
    position: absolute; right: 6px; bottom: 4px; font-size: 10px; color: #52606d;
    background: rgba(255,255,255,.75); padding: 2px 6px; border-radius: 4px;
  }
  #carga {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; font-size: 14px; color: #3e4c59;
  }
  #carga .caja { background: rgba(255,255,255,.92); padding: 10px 16px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  #carga.oculto { display: none; }
  #carga.error .caja { color: #9b1c1c; }
  #toast {
    position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #1f2933; color: #fff; font-size: 12px; padding: 6px 12px; border-radius: 6px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #toast.visible { opacity: .92; }

  #tiempo {
    position: absolute; right: 12px; top: 110px; max-width: 210px;
    background: rgba(255,255,255,.93); border-radius: 10px; padding: 8px 10px;
    box-shadow: 0 2px 12px rgba(15,23,42,.14); font-size: 12px;
  }
  #tiempo .tit { font-weight: 600; color: #3e4c59; margin-bottom: 4px; }
  #tiempo .anios { display: flex; flex-wrap: wrap; gap: 4px; }
  #tiempo button {
    font: inherit; font-size: 11px; padding: 2px 7px; border-radius: 999px; cursor: pointer;
    border: 1px solid #cbd2d9; background: #fff; color: #1f2933;
  }
  #tiempo button.activo { background: #1f2933; color: #fff; border-color: #1f2933; }
  #tiempo .nota { color: #616e7c; font-size: 10.5px; margin-top: 5px; line-height: 1.3; }
  #tiempo.oculto { display: none; }
  #mini { position: absolute; left: 12px; width: 92px; pointer-events: none; }
  #mini svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.18)); }

  body.ui-min .panel, body.ui-galeria .panel, body.ui-none .panel,
  body.ui-min #galeria, body.ui-none #galeria, body.ui-none #cabecera,
  body.sin-galeria #galeria { display: none; }
  body.ui-none #tiempo, body.ui-none #mini, body.sin-tiempo #tiempo, body.sin-mini #mini { display: none; }
  @media (max-width: 640px) {
    #cabecera h1 { font-size: 17px; }
    .panel { display: none; }
    #tiempo { top: auto; bottom: 150px; right: 8px; max-width: 160px; }
    #mini { width: 64px; }
    .tn { width: 78px; } .tn canvas { width: 58px; height: 58px; }
  }

  /* Fichas narrativas con atribución: accesorias al diorama y aptas para iframe. */
  #btnContexto { position:absolute;top:72px;right:12px;z-index:24; border:1px solid #d6e1e8;
    border-radius:999px;background:#183a52;color:white;padding:9px 14px;font:600 12px system-ui;
    box-shadow:0 5px 18px #132c3a29;cursor:pointer; }
  #btnContexto:hover,#btnContexto[aria-expanded="true"]{background:#0e6b88}
  #contexto {position:absolute;right:12px;top:116px;width:min(375px,calc(100vw - 24px));max-height:calc(100vh - 290px);
    z-index:23;overflow:auto;background:rgba(255,255,255,.97);box-shadow:0 15px 40px #142f4040;
    border:1px solid #dbe4ec;border-radius:14px;padding:17px 19px;color:#253746;font-size:12px;line-height:1.55;}
  #contexto[hidden]{display:none!important}
  .ctx-tag{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#647689;font-weight:750;margin:0 0 7px}
  #contexto h2{font-size:17px;line-height:1.25;margin:0 20px 9px 0;color:#12364e}
  .ctx-body{margin:0 0 14px;line-height:1.65;font-size:12px}
  .ctx-h{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#637589;margin:14px 0 8px;font-weight:800}
  .ctx-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .ctx-metric{background:#f3f7fa;border:1px solid #e0e9ef;padding:9px;border-radius:9px}
  .ctx-metric strong{display:block;font-size:15px;line-height:1.3;color:#143e5a}
  .ctx-metric span{font-size:10px;color:#62778a}
  .ctx-timeline{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid #b2c9d7}
  .ctx-timeline li{margin:0 0 10px 0;padding-left:8px}
  .ctx-timeline b{display:block;color:#135b78}
  .ctx-warning{padding:10px;background:#fff7ea;border-left:3px solid #d4933a;border-radius:7px;color:#70532b;font-size:11px;line-height:1.5;margin-top:12px}
  .ctx-sources{margin:0;padding-left:18px}
  .ctx-sources li{margin:5px 0}
  .ctx-sources a{color:#075c8b;text-decoration:underline;overflow-wrap:anywhere}
  .ctx-note{margin-top:12px;font-size:10px;color:#687b89}
  .ctx-variant{display:block;width:100%;font:600 11px system-ui;margin-top:10px;padding:8px;border:1px solid #a8cadc;background:#eff8fc;border-radius:8px;color:#155b7a;cursor:pointer}
  /* La ficha narrativa y el selector histórico ya no se ocultan mutuamente. */
  body.ui-none #btnContexto,body.ui-none #contexto{display:none!important}
  @media(max-width:640px){#btnContexto{top:57px;right:8px;padding:8px 11px;font-size:11px}
    #contexto{top:97px;right:8px;max-height:calc(100vh - 265px);width:calc(100vw - 16px);padding:13px 14px}
    .ctx-metric strong{font-size:13px}}

  /* VISTA STORYMAPS: ficha a la derecha y símbolo de información destacado */
  #btnContexto{
    right:16px;top:79px;display:inline-flex;align-items:center;gap:11px;
    min-height:56px;padding:9px 16px 9px 10px;border-radius:15px;
    background:#123e58;color:white;box-shadow:0 8px 24px #0a24394f;
    font:750 13px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;
    text-align:left;border:1px solid #12516a;
  }
  #btnContexto:hover,#btnContexto[aria-expanded="true"]{background:#075f80}
  #btnContexto:focus-visible{outline:3px solid #f3bd54;outline-offset:3px}
  #btnContexto .ctx-icon{
    width:37px;height:37px;flex:none;display:grid;place-items:center;
    border-radius:50%;background:#ffffff28;border:1px solid #ffffff80;
    font:700 27px/1 Georgia,serif;
  }
  #btnContexto .ctx-label{max-width:140px}
  #contexto{
    right:16px;top:148px;width:min(410px,calc(100vw - 32px));
    max-height:calc(100dvh - 280px);
    overflow-y:auto;overscroll-behavior:contain;
    border:1px solid #c9dce8;background:rgba(255,255,255,.985);
    border-radius:15px;box-shadow:0 18px 50px #12354955;
    padding:19px 21px 22px;
  }
  #contexto h2{font-size:18px}
  @media(max-width:640px){
    #btnContexto{right:9px;top:60px;min-height:49px;padding:7px 10px;gap:8px;font-size:12px}
    #btnContexto .ctx-icon{width:33px;height:33px;font-size:24px}
    #btnContexto .ctx-label{max-width:114px}
    #contexto{top:118px;right:9px;width:min(370px,calc(100vw - 18px));
      max-height:calc(100dvh - 244px);padding:15px 16px;}
  }
  @media(max-height:510px){
    #btnContexto{top:54px}
    #contexto{top:115px;max-height:calc(100dvh - 182px)}
  }


/* StoryMaps · información a la DERECHA, sin ocultar los controles del diorama */
#btnContexto {
  left:auto !important;right:14px !important;top:76px;
  min-width:208px;min-height:62px;z-index:40;
  justify-content:flex-start;box-shadow:0 8px 25px #10283e55;
}
#btnContexto .ctx-icon {width:43px;height:43px;font-size:30px;}
#btnContexto .ctx-label {max-width:160px;font-size:13px;}
#contexto {
  left:auto !important;right:14px !important;top:150px;
  width:min(395px,calc(100vw - 28px));
  max-height:calc(100dvh - 280px);z-index:39;
}
/* El selector de imagen histórica acompaña al panel de navegación, a la izquierda. */
#tiempo {
  left:12px !important;right:auto !important;top:110px;
  width:min(215px,calc(100vw - 24px));box-sizing:border-box;
  z-index:15;overflow-y:auto;overscroll-behavior:contain;
}
.panel {
  max-height:max(125px,calc(100dvh - 365px));
  overflow-y:auto;box-sizing:border-box;
  z-index:16;
}
/* El minimapa queda al lado contrario para no tapar la selección histórica. */
#mini {left:auto !important;right:12px !important;}
body.contexto-abierto #mini {display:none;}
@media(max-width:640px){
  #btnContexto{left:auto !important;right:9px !important;top:62px;min-width:0;min-height:52px;padding:6px 12px 6px 7px;}
  #btnContexto .ctx-icon{width:36px;height:36px;font-size:26px;}
  #btnContexto .ctx-label{max-width:125px;font-size:12px;}
  #contexto{left:auto !important;right:9px !important;top:124px;width:calc(100vw - 18px);max-height:calc(100dvh - 251px);}
  #tiempo{top:auto;left:9px !important;right:auto !important;bottom:150px;width:min(178px,calc(100vw - 18px));max-height:175px;}
}
@media(max-height:530px){
  #btnContexto{top:50px;}
  #contexto{top:112px;max-height:calc(100dvh - 180px);}
}

</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>

<div id="cabecera">
  <h1 id="titulo">Cargando…</h1>
  <div class="sub" id="sub"></div>
  <div id="chips"></div>
  <div class="meta" id="meta"></div>
</div>

<div id="galeria" role="list" aria-label="Sitios"></div>

<div class="panel" id="panel">
  <div class="coords" id="coords"></div>
  <details class="obs solo-full" id="obsBox"><summary>Observación de control de calidad</summary><div id="obs"></div></details>
  <div class="ctrl solo-full">
    <label>Exageración vertical: <span id="exagVal"></span>
      <input type="range" id="exag" min="1" max="5" step="0.5">
    </label>
    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="chkEdif"> Edificios 3D</label>
    <label>Altura de edificios: <span id="fEdifVal"></span>
      <input type="range" id="fEdif" min="1" max="5" step="0.5">
    </label>
    <div class="btns">
      <button id="btnVista" type="button">Restablecer vista</button>
      <button id="btnRotar" type="button">Pausar giro</button>
      <button id="btnCopiar" type="button">Copiar URL para StoryMap</button>
    </div>
  </div>
</div>


<button id="btnContexto" type="button" aria-controls="contexto" aria-expanded="false" aria-label="Abrir información del asentamiento"><span class="ctx-icon" aria-hidden="true">ⓘ</span><span class="ctx-label">Información del asentamiento</span></button>
<aside id="contexto" hidden aria-label="Ficha informativa contextual del lugar" aria-live="polite"></aside>

<div id="tiempo" class="oculto">
  <div class="tit">Imagen satelital</div>
  <div class="anios" id="anios"></div>
  <div class="nota" id="notaTiempo"></div>
</div>
<div id="mini" aria-hidden="true"></div>

<div id="carga"><div class="caja" id="cargaTxt">Descargando relieve e imagen…</div></div>
<div id="toast"></div>
<div class="attr">Imagen: Esri, Maxar, Earthstar Geographics · Elevación: AWS Terrain Tiles (Mapzen) · Edificios: Overture Maps Foundation (ODbL) · three.js</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- Datos (Puntos_asentamientos_comparacion_ArcGIS.csv) ---------- */
const DATOS = [{"nombre": "Granizal", "municipio": "Bello", "departamento": "Antioquia", "variante": "Excel original", "lat": 6.30317, "lon": -75.53327, "tipo": "Punto original referencial", "qa": "Verificar límite", "apto": "No", "obs": "El nombre figura en OSM/Copacabana; Granizal como asentamiento/vereda pertenece a Bello. Revisar polígono municipal y sector exacto antes de publicar."}, {"nombre": "Resguardo Yanacona Yachay Wasi", "municipio": "Mocoa", "departamento": "Putumayo", "variante": "Excel original", "lat": 1.18029, "lon": -76.63538, "tipo": "Punto original referencial", "qa": "Referencial", "apto": "No", "obs": "Medio Afán es un caserío. Se confirma asociación territorial pero no que el punto corresponda al resguardo (compuesto por predios)."}, {"nombre": "Resguardo Yanacona Villa María de Anamú", "municipio": "Mocoa", "departamento": "Putumayo", "variante": "Excel original", "lat": 1.19487, "lon": -76.62956, "tipo": "Punto original referencial", "qa": "Entidad distinta", "apto": "No", "obs": "Es un resguardo diferente, NO una alternativa intercambiable de Yachay Wasi. El punto representa la aldea Anamú."}, {"nombre": "Cúcuta (asentamiento sin especificar)", "municipio": "Cúcuta", "departamento": "Norte de Santander", "variante": "Excel original", "lat": 7.89715, "lon": -72.50804, "tipo": "Punto original referencial", "qa": "No utilizar como asentamiento", "apto": "No", "obs": "Solo representa centroide urbano; falta identificar asentamiento."}, {"nombre": "Bajamar: Alberto Lleras Camargo", "municipio": "Buenaventura", "departamento": "Valle del Cauca", "variante": "Excel original", "lat": 3.87509, "lon": -77.06142, "tipo": "Punto original referencial", "qa": "Referencial", "apto": "No", "obs": "Ubicación del barrio cartográfico OSM, no coordenada levantada de un asentamiento o polígono de bajamar."}, {"nombre": "Bajamar: Punta del Este", "municipio": "Buenaventura", "departamento": "Valle del Cauca", "variante": "Excel original", "lat": 3.88368, "lon": -77.05282, "tipo": "Punto original referencial", "qa": "Referencial", "apto": "No", "obs": "Ubicación del barrio cartográfico OSM, no coordenada levantada de un asentamiento o polígono de bajamar."}, {"nombre": "Bajamar: La Playita", "municipio": "Buenaventura", "departamento": "Valle del Cauca", "variante": "Excel original", "lat": 3.8776, "lon": -77.06669, "tipo": "Punto original referencial", "qa": "Referencial", "apto": "No", "obs": "Ubicación del barrio cartográfico OSM, no coordenada levantada de un asentamiento o polígono de bajamar."}, {"nombre": "Cabildo Siona Mame Ñata Umuguse (Nuevo Amanecer)", "municipio": "Puerto Asís", "departamento": "Putumayo", "variante": "Excel original", "lat": 0.48395, "lon": -76.48343, "tipo": "Punto original referencial", "qa": "Conflicto de ubicación", "apto": "No", "obs": "CSV está a 2,286 km del punto escolar del Excel. Fuentes sitúan el cabildo históricamente en Villa Docente. Se requiere georreferencia de campo."}, {"nombre": "Cabildo Siona Mame Ñata Umuguse (Nuevo Amanecer)", "municipio": "Puerto Asís", "departamento": "Putumayo", "variante": "CSV aportado", "lat": 0.4987812531042517, "lon": -76.49766860943132, "tipo": "Candidato sin validación de campo", "qa": "Conflicto de ubicación", "apto": "No", "obs": "CSV está a 2,286 km del punto escolar del Excel. Fuentes sitúan el cabildo históricamente en Villa Docente. Se requiere georreferencia de campo."}, {"nombre": "Antiguo Aeropuerto", "municipio": "Uribia", "departamento": "La Guajira", "variante": "CSV aportado", "lat": 11.713694949690034, "lon": -72.27205004491454, "tipo": "Candidato sin validación de campo", "qa": "Conflicto de ubicación", "apto": "No", "obs": "Municipio correcto Uribia, La Guajira. CSV a 1,652 km del punto del barrio El Aeropuerto OSM. Confirmar ubicación y sector dentro de Flor del Campo."}, {"nombre": "Antiguo Aeropuerto", "municipio": "Uribia", "departamento": "La Guajira", "variante": "OSM barrio El Aeropuerto", "lat": 11.69939, "lon": -72.27616, "tipo": "Referencia de barrio, no de todo el asentamiento", "qa": "Conflicto de ubicación", "apto": "No", "obs": "Municipio correcto Uribia, La Guajira. CSV a 1,652 km del punto del barrio El Aeropuerto OSM. Confirmar ubicación y sector dentro de Flor del Campo."}];

/* ---------- Parámetros de URL ----------
   sitio=N     número del sitio (1 a N, en el orden del CSV)
   lat, lon    coordenadas libres (anulan "sitio"); nombre=... opcional
   r=500       radio en metros (100 a 3000)
   exag=1.5    exageración vertical (1 a 5)
   ui=full     título, galería de miniaturas y panel de controles
   ui=galeria  título y galería (sin panel)
   ui=min      solo título
   ui=none     solo el diorama
   rotar=0     desactiva el giro automático
   bg=transparent | hex sin # (p. ej. ffffff)
   zimg=17     zoom de la imagen satelital (14 a 18)
   edif=0      oculta los edificios
   fedif=3     factor de altura de los edificios (1 a 5)
   hdef=3.5    altura asumida (m) para edificios sin dato de altura ni pisos
   ecolor=gris edificios en gris claro en vez del color de la imagen
   fecha=2019  abre con la imagen histórica (Esri Wayback) más cercana a ese año
   tiempo=0|1  oculta o muestra el selector de fechas (por defecto visible salvo en ui=min)
   mapa=0      oculta el mapa de ubicación
   curvas=0    quita las curvas de nivel

/* ---------- Utilidades geográficas (Web Mercator) ---------- */
const lon2px = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
const lat2px = (lat, z) => {
  const s = Math.sin(lat * Math.PI / 180);
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * 2 ** z;
};

function cargarImg(url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('No cargó ' + url));
    im.src = url;
  });
}

async function mosaico(lat, lon, R, z, urlFn, leer) {
  const dLat = R / 111320 * 1.08;
  const dLon = R / (111320 * Math.cos(lat * Math.PI / 180)) * 1.08;
  const x0 = lon2px(lon - dLon, z), x1 = lon2px(lon + dLon, z);
  const y0 = lat2px(lat + dLat, z), y1 = lat2px(lat - dLat, z);
  const tx0 = Math.floor(x0 / 256), tx1 = Math.floor(x1 / 256);
  const ty0 = Math.floor(y0 / 256), ty1 = Math.floor(y1 / 256);
  const W = (tx1 - tx0 + 1) * 256, H = (ty1 - ty0 + 1) * 256;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: !!leer });
  const trabajos = [];
  for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
    trabajos.push(cargarImg(urlFn(z, tx, ty)).then(im => ctx.drawImage(im, (tx - tx0) * 256, (ty - ty0) * 256)));
  }
  const r = await Promise.allSettled(trabajos);
  const fallos = r.filter(x => x.status === 'rejected').length;
  if (fallos === trabajos.length) throw new Error('No se pudo descargar ninguna tesela (zoom ' + z + ').');
  return { canvas: cv, ctx, oX: tx0 * 256, oY: ty0 * 256, W, H, z, fallos };
}

// centra el diorama en el espacio libre entre la cabecera y la galería
function redimensionar() {
  const w = app.clientWidth || window.innerWidth, h = app.clientHeight || window.innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const vis = el => el && el.offsetParent !== null ? el.getBoundingClientRect() : null;
  const cab = vis(document.getElementById('cabecera')), gal = vis(document.getElementById('galeria'));
  const arriba = cab ? cab.bottom : 0, abajo = gal ? h - gal.top : 0;
  const dy = (abajo - arriba) / 2;
  if (Math.abs(dy) > 1) camera.setViewOffset(w, h, 0, dy, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  // alejar la cámara en proporción al alto que ocupan cabecera y galería
  const libre = Math.max(0.35, (h - arriba - abajo) / h);
  const fAspecto = Math.max(1, 1.15 / Math.min(1.6, w / Math.max(1, h - arriba - abajo)));
  const nuevo = 1 / libre * fAspecto;
  if (Math.abs(nuevo - factorEncuadre) > 0.01) {
    const prev = factorEncuadre; factorEncuadre = nuevo;
    if (camera.position.lengthSq() > 0) camera.position.multiplyScalar(nuevo / prev);
  }
  ajustarLimitesZoom();
}
var factorEncuadre = 1;
// Margen de exploración moderado respecto al tamaño del diorama.
function ajustarLimitesZoom() {
  const distanciaInicial = RADIO * 2.9 * factorEncuadre / CAM_ZOOM;
  controls.minDistance = Math.max(RADIO * 0.95, distanciaInicial * 0.65);
  controls.maxDistance = Math.max(RADIO * 3.5, distanciaInicial * 1.9);
}
window.addEventListener('resize', redimensionar);

function vistaInicial() {
  ajustarLimitesZoom();
  const d = RADIO * 2.9 * factorEncuadre / CAM_ZOOM, a = CAM_EL * Math.PI / 180, az = CAM_AZ * Math.PI / 180;
  camera.position.set(d * Math.cos(a) * -Math.sin(az), d * Math.sin(a), d * Math.cos(a) * Math.cos(az));
  controls.target.set(0, 0, 0);
  controls.update();
}

/* ---------- Curvas de nivel (inyectadas en el shader estándar) ---------- */
const U_CURVAS = { uExag: { value: 1.5 }, uE0: { value: 0 }, uInt: { value: 10 } };
function conCurvas(mat, fuerza, colorHex) {
  if (!VER_CURVAS) return mat;
  mat.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U_CURVAS, { uFuerza: { value: fuerza }, uColorCurva: { value: new THREE.Color(colorHex) } });
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vYMundo;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvYMundo = (modelMatrix * vec4(transformed, 1.0)).y;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying float vYMundo;\nuniform float uExag, uE0, uInt, uFuerza;\nuniform vec3 uColorCurva;')
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
        float elevM = vYMundo / uExag + uE0;
        float f1 = elevM / uInt;
        float l1 = 1.0 - smoothstep(0.0, fwidth(f1) * 1.1, abs(fract(f1 - 0.5) - 0.5));
        float f5 = elevM / (uInt * 5.0);
        float l5 = 1.0 - smoothstep(0.0, fwidth(f5) * 1.8, abs(fract(f5 - 0.5) - 0.5));
        float aC = max(l1 * uFuerza, l5 * min(1.0, uFuerza * 1.7));
        gl_FragColor.rgb = mix(gl_FragColor.rgb, uColorCurva, aC);`);
  };
  mat.customProgramCacheKey = () => 'curvas' + fuerza + colorHex;
  return mat;
}
function intervaloCurvas(desnivel) {
  return desnivel < 15 ? 1 : desnivel < 40 ? 2 : desnivel < 100 ? 5 : desnivel < 300 ? 10 : 25;
}

/* ---------- Texturas auxiliares ---------- */
function texturaSombra() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  gr.addColorStop(0, 'rgba(20,30,40,0.35)');
  gr.addColorStop(0.55, 'rgba(20,30,40,0.18)');
  gr.addColorStop(1, 'rgba(20,30,40,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

function spriteTexto(txt, color) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.9)';
  g.beginPath(); g.arc(64, 64, 46, 0, Math.PI * 2); g.fill();
  g.fillStyle = color; g.font = 'bold 64px system-ui, Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(txt, 64, 68);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  s.scale.set(RADIO * 0.13, RADIO * 0.13, 1);
  s.renderOrder = 10;
  return s;
}

/* ---------- Construcción del diorama ---------- */
let grupo = null;
let modelo = null;   // datos para recalcular con otra exageración

function liberar(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
}

function construir(sitio, dem, img) {
  const { lat, lon } = sitio;
  const mLat = 111320, mLon = 111320 * Math.cos(lat * Math.PI / 180);
  const d = dem.ctx.getImageData(0, 0, dem.W, dem.H).data;

  const elevPx = (xx, yy) => { const i = (yy * dem.W + xx) * 4; return d[i] * 256 + d[i + 1] + d[i + 2] / 256 - 32768; };
  function elev(px, py) {
    let x = clamp(px - dem.oX - 0.5, 0, dem.W - 1.001);
    let y = clamp(py - dem.oY - 0.5, 0, dem.H - 1.001);
    const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
    const a = elevPx(x0, y0), b = elevPx(x0 + 1, y0), c = elevPx(x0, y0 + 1), e = elevPx(x0 + 1, y0 + 1);
    // el mar (batimetría negativa) se deja a nivel 0 para no hundir zonas costeras
    return Math.max(0, (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + e * fx) * fy);
  }

  const nV = 1 + NR * NS;
  const xs = new Float32Array(nV), zs = new Float32Array(nV), el = new Float32Array(nV);
  const uv = new Float32Array(nV * 2);
  function fijar(k, x, n) {
    const la = lat + n / mLat, lo = lon + x / mLon;
    el[k] = elev(lon2px(lo, Z_DEM), lat2px(la, Z_DEM));
    uv[2 * k] = (lon2px(lo, Z_IMG) - img.oX) / img.W;
    uv[2 * k + 1] = 1 - (lat2px(la, Z_IMG) - img.oY) / img.H;
    xs[k] = x; zs[k] = -n;   // X = este, -Z = norte
  }
  fijar(0, 0, 0);
  for (let i = 1; i <= NR; i++) {
    const r = RADIO * i / NR;
    for (let j = 0; j < NS; j++) {
      const t = 2 * Math.PI * j / NS;
      fijar(1 + (i - 1) * NS + j, r * Math.cos(t), r * Math.sin(t));
    }
  }

  // índices de la superficie
  const idx = [];
  const K = (i, j) => 1 + (i - 1) * NS + (j % NS);
  for (let j = 0; j < NS; j++) idx.push(0, K(1, j), K(1, j + 1));
  for (let i = 1; i < NR; i++) for (let j = 0; j < NS; j++) {
    const a = K(i, j), b = K(i, j + 1), c = K(i + 1, j), e = K(i + 1, j + 1);
    idx.push(a, c, e, a, e, b);
  }
  const geoSup = new THREE.BufferGeometry();
  geoSup.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nV * 3), 3));
  geoSup.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geoSup.setIndex(idx);

  const texImg = new THREE.CanvasTexture(img.canvas);
  texImg.colorSpace = THREE.SRGBColorSpace;
  texImg.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const sup = new THREE.Mesh(geoSup, conCurvas(new THREE.MeshStandardMaterial({ map: texImg, roughness: 1, metalness: 0 }), 0.28, 0xffffff));
  sup.castShadow = true; sup.receiveShadow = true;

  // pared lateral (corte de suelo)
  const nW = (NS + 1) * 2;
  const geoPar = new THREE.BufferGeometry();
  const nrm = new Float32Array(nW * 3), uvP = new Float32Array(nW * 2);
  const idxP = [];
  for (let j = 0; j <= NS; j++) {
    const t = 2 * Math.PI * j / NS, cx = Math.cos(t), cz = -Math.sin(t);
    for (let s = 0; s < 2; s++) {
      const v = 2 * j + s;
      nrm[3 * v] = cx; nrm[3 * v + 1] = 0; nrm[3 * v + 2] = cz;
      uvP[2 * v] = j / NS * 10; uvP[2 * v + 1] = s === 0 ? 1 : 0;
    }
    if (j < NS) idxP.push(2 * j, 2 * j + 1, 2 * j + 3, 2 * j, 2 * j + 3, 2 * j + 2);
  }
  geoPar.setAttribute('position', new THREE.BufferAttribute(new Float32Array(nW * 3), 3));
  geoPar.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geoPar.setAttribute('uv', new THREE.BufferAttribute(uvP, 2));
  geoPar.setIndex(idxP);
  // borde neutro con curvas de nivel (sin estratos inventados)
  const par = new THREE.Mesh(geoPar, conCurvas(new THREE.MeshStandardMaterial({ color: 0xe3dccf, roughness: 1, metalness: 0 }), 0.42, 0x8c7b66));
  par.castShadow = true; par.receiveShadow = true;

  // tapa inferior
  const geoBase = new THREE.CircleGeometry(RADIO, NS);
  geoBase.rotateX(Math.PI / 2);
  const base = new THREE.Mesh(geoBase, new THREE.MeshStandardMaterial({ color: 0xb9b0a1, roughness: 1 }));

  // sombra suave
  const sombra = new THREE.Mesh(
    new THREE.PlaneGeometry(RADIO * 3.4, RADIO * 3.4).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: texturaSombra(), transparent: true, depthWrite: false })
  );

  // marcador del punto
  const hPin = RADIO * 0.14;
  const pin = new THREE.Group();
  const palo = new THREE.Mesh(new THREE.CylinderGeometry(RADIO * 0.0045, RADIO * 0.0045, hPin, 12),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 }));
  palo.position.y = hPin / 2;
  const bola = new THREE.Mesh(new THREE.SphereGeometry(RADIO * 0.022, 24, 16),
    new THREE.MeshStandardMaterial({ color: 0xd64545, roughness: 0.45 }));
  bola.position.y = hPin;
  pin.add(palo, bola);

  // norte
  const norte = spriteTexto('N', '#1f2933');

  grupo = new THREE.Group();
  grupo.add(sup, par, base, sombra, pin, norte);
  scene.add(grupo);

  let eMin = Infinity, eMax = -Infinity;
  for (let k = 0; k < nV; k++) { if (el[k] < eMin) eMin = el[k]; if (el[k] > eMax) eMax = el[k]; }
  const elevLL = (la, lo) => elev(lon2px(lo, Z_DEM), lat2px(la, Z_DEM));
  const imgPix = img.ctx.getImageData(0, 0, img.W, img.H).data;
  // color promedio de la imagen satelital en un punto (ventana de 3x3 píxeles)
  const colorLL = (la, lo) => {
    const px = Math.round(lon2px(lo, Z_IMG) - img.oX), py = Math.round(lat2px(la, Z_IMG) - img.oY);
    let r = 0, g = 0, b = 0, n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = px + dx, y = py + dy;
      if (x < 0 || y < 0 || x >= img.W || y >= img.H) continue;
      const i = (y * img.W + x) * 4; r += imgPix[i]; g += imgPix[i + 1]; b += imgPix[i + 2]; n++;
    }
    return n ? [r / n, g / n, b / n, n] : [200, 200, 200, 1];
  };
  modelo = { xs, zs, el, nV, geoSup, geoPar, base, sombra, norte, eMin, eMax, e0: el[0], elevLL, colorLL, lat, lon, mLat, mLon, edif: null, mallaEdif: null,
    sup, img, texImg, wayback: null };
  U_CURVAS.uE0.value = el[0];
  U_CURVAS.uInt.value = intervaloCurvas(eMax - eMin);
  aplicarExag();
  actualizarMeta(sitio);
}

function aplicarExag() {
  if (!modelo) return;
  const { xs, zs, el, nV, geoSup, geoPar, base, sombra, norte, eMin, e0 } = modelo;
  const pos = geoSup.attributes.position.array;
  let yMax = -Infinity;
  for (let k = 0; k < nV; k++) {
    const y = (el[k] - e0) * exag;
    pos[3 * k] = xs[k]; pos[3 * k + 1] = y; pos[3 * k + 2] = zs[k];
    if (y > yMax) yMax = y;
  }
  geoSup.attributes.position.needsUpdate = true;
  geoSup.computeVertexNormals();
  geoSup.computeBoundingSphere();

  const yBase = (eMin - e0) * exag - PROF_BASE;
  const pp = geoPar.attributes.position.array;
  for (let j = 0; j <= NS; j++) {
    const k = 1 + (NR - 1) * NS + (j % NS);
    const vT = 2 * j, vB = 2 * j + 1;
    pp[3 * vT] = xs[k]; pp[3 * vT + 1] = (el[k] - e0) * exag; pp[3 * vT + 2] = zs[k];
    pp[3 * vB] = xs[k]; pp[3 * vB + 1] = yBase; pp[3 * vB + 2] = zs[k];
  }
  geoPar.attributes.position.needsUpdate = true;
  geoPar.computeBoundingSphere();

  base.position.y = yBase;
  sombra.position.y = yBase - RADIO * 0.07;
  norte.position.set(0, Math.max(0, yMax) * 0.5, -RADIO * 1.13);
  controls.target.set(0, (yBase + Math.max(0, yMax)) * 0.25, 0);

  document.getElementById('exagVal').textContent = '×' + exag.toFixed(1);
  U_CURVAS.uExag.value = exag;
  construirMallaEdif();
  if (modelo.sitio) actualizarMeta(modelo.sitio);
}

/* ---------- Edificios (Overture Maps, PMTiles) ---------- */
let libsEdif = null;
async function cargarLibsEdif() {
  if (!libsEdif) libsEdif = Promise.all([
    import('https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/+esm'),
    import('https://cdn.jsdelivr.net/npm/@mapbox/vector-tile@2.0.3/+esm'),
    import('https://cdn.jsdelivr.net/npm/pbf@4.0.1/+esm')
  ]).then(([pm, vt, pbf]) => ({ PMTiles: pm.PMTiles, VectorTile: vt.VectorTile, Pbf: pbf.default }));
  return libsEdif;
}

let archivoEdif = null;   // PMTiles de la versión más reciente de Overture
async function abrirOverture(L) {
  if (archivoEdif) return archivoEdif;
  const base = 'https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com/tiles/';
  let versiones = [];
  try {
    const cat = await (await fetch('https://stac.overturemaps.org/catalog.json')).json();
    versiones = (cat.links || []).map(l => (l.href.match(/(\d{4}-\d{2}-\d{2}\.\d+)\/catalog\.json/) || [])[1]).filter(Boolean);
    versiones = [...new Set(versiones)].sort().reverse();
  } catch (e) { console.warn('Catálogo STAC no disponible', e); }
  for (const v of versiones) {
    try {
      const pm = new L.PMTiles(base + v + '/buildings.pmtiles');
      await pm.getHeader();
      archivoEdif = { pm, version: v };
      return archivoEdif;
    } catch (e) { /* probar la siguiente versión */ }
  }
  throw new Error('No se encontró una versión vigente de Overture.');
}

function areaAnillo(r) {
  let a = 0;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) a += (r[j][0] + r[i][0]) * (r[j][1] - r[i][1]);
  return a / 2;
}

async function cargarEdificios(sitio, mio) {
  const L = await cargarLibsEdif();
  const { pm, version } = await abrirOverture(L);
  const z = 14;
  const { lat, lon, mLat, mLon } = modelo;
  const dLat = RADIO / mLat, dLon = RADIO / mLon;
  const n = 2 ** z;
  const tx0 = Math.floor(lon2px(lon - dLon, z) / 256), tx1 = Math.floor(lon2px(lon + dLon, z) / 256);
  const ty0 = Math.floor(lat2px(lat + dLat, z) / 256), ty1 = Math.floor(lat2px(lat - dLat, z) / 256);
  const porId = new Map();
  for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
    const r = await pm.getZxy(z, tx, ty);
    if (!r || !r.data) continue;
    const vt = new L.VectorTile(new L.Pbf(new Uint8Array(r.data)));
    const capa = vt.layers.building || vt.layers[Object.keys(vt.layers)[0]];
    if (!capa) continue;
    for (let i = 0; i < capa.length; i++) {
      const f = capa.feature(i);
      if (f.type !== 3) continue;
      const gj = f.toGeoJSON(tx, ty, z);
      const polis = gj.geometry.type === 'Polygon' ? [gj.geometry.coordinates] : gj.geometry.coordinates;
      const p = f.properties || {};
      const id = p.id || p['@id'] || ('t' + tx + '_' + ty + '_' + i);
      for (const anillos of polis) {
        // a metros locales (x = este, y = norte)
        const loc = anillos.map(a => a.map(([lo, la]) => [(lo - lon) * mLon, (la - lat) * mLat]));
        const ext = loc[0];
        if (ext.length < 4) continue;
        if (!ext.every(([x, y]) => x * x + y * y <= (RADIO * 0.995) ** 2)) continue;
        const area = Math.abs(areaAnillo(ext));
        if (area < 4) continue;
        const clave = id + (polis.length > 1 ? '_' + Math.round(ext[0][0]) + '_' + Math.round(ext[0][1]) : '');
        const prev = porId.get(clave);
        if (prev && prev.area >= area) continue;   // pieza duplicada en el borde de la tesela
        let h = parseFloat(p.height), fuente = 'altura';
        if (!(h > 0)) {
          const pisos = parseFloat(p.num_floors);
          if (pisos > 0) { h = pisos * M_PISO; fuente = 'pisos'; }
          else { h = H_DEF; fuente = 'estimada'; }
        }
        porId.set(clave, { anillos: loc, area, h, fuente, minH: parseFloat(p.min_height) || 0 });
      }
    }
  }
  if (mio !== turno || !modelo) return;
  const lista = [...porId.values()];
  // elevación del terreno bajo cada edificio (mínimo de sus vértices)
  for (const b of lista) {
    let m = Infinity;
    for (const [x, y] of b.anillos[0]) m = Math.min(m, modelo.elevLL(lat + y / mLat, lon + x / mLon));
    b.suelo = m;
    b.color = colorTecho(b.anillos[0]);
  }
  modelo.edif = { lista, version, conAltura: lista.filter(b => b.fuente !== 'estimada').length };
  construirMallaEdif();
  actualizarMeta(sitio);
}

function dentro(x, y, r) {
  let c = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    if ((r[i][1] > y) !== (r[j][1] > y) && x < (r[j][0] - r[i][0]) * (y - r[i][1]) / (r[j][1] - r[i][1]) + r[i][0]) c = !c;
  }
  return c;
}

// promedio del color de la imagen sobre una rejilla de puntos dentro de la huella
function colorTecho(ext) {
  const { lat, lon, mLat, mLon, colorLL } = modelo;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [x, y] of ext) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const pasos = 5;
  let r = 0, g = 0, b = 0, n = 0;
  for (let i = 0; i < pasos; i++) for (let j = 0; j < pasos; j++) {
    const x = x0 + (x1 - x0) * (i + 0.5) / pasos, y = y0 + (y1 - y0) * (j + 0.5) / pasos;
    if (!dentro(x, y, ext)) continue;
    const c = colorLL(lat + y / mLat, lon + x / mLon);
    r += c[0]; g += c[1]; b += c[2]; n++;
  }
  if (!n) { let cx = 0, cy = 0; ext.forEach(([x, y]) => { cx += x; cy += y; }); const c = colorLL(lat + cy / ext.length / mLat, lon + cx / ext.length / mLon); return [c[0] / 255, c[1] / 255, c[2] / 255]; }
  return [r / n / 255, g / n / 255, b / n / 255];
}

function construirMallaEdif() {
  if (!modelo) return;
  if (modelo.mallaEdif) { grupo.remove(modelo.mallaEdif); liberar(modelo.mallaEdif); modelo.mallaEdif = null; }
  if (!verEdif || !modelo.edif || !modelo.edif.lista.length) return;
  const geos = [];
  const col = new THREE.Color();
  for (const b of modelo.edif.lista) {
    const forma = new THREE.Shape(b.anillos[0].map(([x, y]) => new THREE.Vector2(x, y)));
    for (let k = 1; k < b.anillos.length; k++) forma.holes.push(new THREE.Path(b.anillos[k].map(([x, y]) => new THREE.Vector2(x, y))));
    const alto = Math.max(0.5, (b.h - b.minH) * fEdif);
    const g = new THREE.ExtrudeGeometry(forma, { depth: alto, bevelEnabled: false });
    g.rotateX(-Math.PI / 2);
    const yB = (b.suelo - modelo.e0) * exag - 0.6 + b.minH * fEdif;
    g.translate(0, yB, 0);
    g.deleteAttribute('uv');
    // color del techo tomado de la imagen satelital; fachadas un poco más oscuras
    const nv = g.attributes.position.count, c = new Float32Array(nv * 3);
    const nrmE = g.attributes.normal.array, posE = g.attributes.position.array;
    if (COLOR_EDIF === 'gris') col.setRGB(0.9, 0.9, 0.88);
    else col.setRGB(b.color[0], b.color[1], b.color[2], THREE.SRGBColorSpace);
    for (let i = 0; i < nv; i++) {
      // techo a plena luz; fachadas más oscuras hacia la base (oclusión simulada)
      const f = nrmE[3 * i + 1] > 0.5 ? 1 : 0.6 + 0.24 * Math.min(1, (posE[3 * i + 1] - yB) / alto);
      c[3 * i] = col.r * f; c[3 * i + 1] = col.g * f; c[3 * i + 2] = col.b * f;
    }
    g.setAttribute('color', new THREE.BufferAttribute(c, 3));
    geos.push(g.index ? g.toNonIndexed() : g);
  }
  const unida = mergeGeometries(geos, false);
  geos.forEach(g => g.dispose());
  if (!unida) return;
  // con imagen histórica, los edificios (actuales) se muestran como fantasmas
  const fantasma = !!(modelo.wayback && !modelo.wayback.actual);
  const malla = new THREE.Mesh(unida, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.9, metalness: 0,
    transparent: fantasma, opacity: fantasma ? 0.28 : 1, depthWrite: !fantasma
  }));
  malla.castShadow = !fantasma; malla.receiveShadow = true;
  modelo.mallaEdif = malla;
  grupo.add(malla);
}

const contexto = document.getElementById('contexto');
const btnContexto = document.getElementById('btnContexto');
const escapeCtx = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function abrirContexto(open) {
  contexto.hidden = !open;
  document.body.classList.toggle('contexto-abierto', open);
  btnContexto.setAttribute('aria-expanded', String(open));
  btnContexto.querySelector('.ctx-icon').textContent = open ? '×' : 'ⓘ';
  btnContexto.querySelector('.ctx-label').textContent = open ? 'Cerrar información' : 'Información del asentamiento';
  btnContexto.setAttribute('aria-label', open ? 'Cerrar información del asentamiento' : 'Abrir información del asentamiento');
}
btnContexto.addEventListener('click', () => abrirContexto(contexto.hidden));
// La ficha inicia siempre cerrada, incluso si StoryMaps conserva una URL antigua con info=1.
// Se abre exclusivamente cuando la persona pulsa el botón informativo.
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !contexto.hidden) abrirContexto(false); });
function renderizarContexto(s) {
  const p = PERFILES[s.nombre];
  if(!p) return;
  const metr = p.cifras.length ? `<div class="ctx-h">Datos documentados</div><div class="ctx-metrics">${p.cifras.map(([val,lab])=>`<div class="ctx-metric"><strong>${escapeCtx(val)}</strong><span>${escapeCtx(lab)}</span></div>`).join('')}</div>` : '';
  const cron = p.hitos.length ? `<div class="ctx-h">Antecedentes e hitos</div><ol class="ctx-timeline">${p.hitos.map(([when,what])=>`<li><b>${escapeCtx(when)}</b>${escapeCtx(what)}</li>`).join('')}</ol>` : '';
  const fuentes = p.fuentes.length ? `<div class="ctx-h">Fuentes públicas</div><ul class="ctx-sources">${p.fuentes.map(([tit,url])=>`<li><a href="${escapeCtx(url)}" target="_blank" rel="noopener noreferrer">${escapeCtx(tit)}</a></li>`).join('')}</ul>` : '<p class="ctx-note">No hay una ficha externa comprobada para este registro genérico.</p>';
  const idxAlterno = SITIOS.findIndex((d,i)=> i !== actual && d.nombre === s.nombre && d.variante !== s.variante);
  contexto.innerHTML = `<div class="ctx-tag">Ficha territorial · Fuentes contrastadas</div><h2>${escapeCtx(s.nombre)}</h2>
    <div class="ctx-tag">${escapeCtx(p.tipo)}</div><p class="ctx-body">${escapeCtx(p.resumen)}</p>
    ${metr}${cron}
    <div class="ctx-warning"><b>Precisión cartográfica:</b> ${escapeCtx(p.precaucion)}
      <div style="margin-top:6px">Referencia actual: ${escapeCtx(s.variante || 'coordenada libre')} · ${Number(s.lat).toFixed(5)}, ${Number(s.lon).toFixed(5)}.</div>
    </div>
    ${idxAlterno>=0?`<button type="button" class="ctx-variant" id="alternarPunto">Ver otra coordenada candidata del mismo lugar</button>`:''}
    ${fuentes}<p class="ctx-note">La ficha documenta el asentamiento o barrio en su conjunto: el círculo de ${Math.round(RADIO)} m es solo un recorte visual, no sus límites. Las alturas y texturas 3D pueden ser aproximadas.</p>`;
  contexto.scrollTop = 0;
  const alt = document.getElementById('alternarPunto');
  if(alt) alt.addEventListener('click',()=>seleccionar(idxAlterno));
}

/* ---------- Panel ---------- */
const $ = id => document.getElementById(id);

function actualizarPanel(s) {
  $('titulo').textContent = s.nombre;
  $('sub').textContent = [s.municipio, s.departamento].filter(Boolean).join(', ') + (s.variante ? ' · ' + s.variante : '');
  $('coords').textContent = s.lat.toFixed(5) + ', ' + s.lon.toFixed(5);
  const chips = $('chips'); chips.replaceChildren();
  const chip = (txt, cls) => { const e = document.createElement('span'); e.className = 'chip ' + cls; e.textContent = txt; chips.appendChild(e); };
  if (s.qa) {
    const cls = /no utilizar|distinta|conflicto/i.test(s.qa) ? 'bad' : 'warn';
    chip('QA: ' + s.qa, cls);
  }
  if (s.apto === 'No') chip('Ubicación referencial, no sitio exacto', 'warn');
  else if (s.apto === 'Sí' || s.apto === 'Si') chip('Sitio exacto', 'ok');
  $('obs').textContent = s.obs || '';
  $('obsBox').style.display = (s.obs && UI === 'full') ? '' : 'none';
  $('meta').textContent = '';
  renderizarContexto(s);
  redimensionar();
}

function actualizarMeta(s) {
  if (!modelo) return;
  modelo.sitio = s;
  const rango = Math.round(modelo.eMax - modelo.eMin);
  let txt = `Radio ${RADIO} m · Altitud ${Math.round(modelo.e0)} m s.n.m. · Desnivel ${rango} m · Relieve exagerado ×${exag.toFixed(1)}`;
  if (verEdif && modelo.edif) {
    const e = modelo.edif, nE = e.lista.length;
    if (!nE) txt += ' · Sin edificios en Overture para esta zona';
    else {
      const pct = Math.round(100 * e.conAltura / nE);
      txt += ` · ${nE.toLocaleString('es-CO')} edificios (Overture ${e.version.slice(0, 7)}), altura ×${fEdif.toFixed(1)}; ` +
        (pct >= 95 ? 'alturas reales' : pct === 0 ? `altura asumida de ${H_DEF} m (sin dato)` : `${pct}% con altura real, el resto asumida de ${H_DEF} m`);
    }
  } else if (verEdif) txt += ' · Cargando edificios…';
  if (VER_CURVAS) txt += ` · Curvas cada ${U_CURVAS.uInt.value} m`;
  const wb = modelo.wayback;
  if (wb && wb.texto) txt += ' · ' + wb.texto;
  $('meta').textContent = txt;
  redimensionar();
}

function aviso(txt) {
  const t = $('toast'); t.textContent = txt; t.classList.add('visible');
  clearTimeout(aviso._t); aviso._t = setTimeout(() => t.classList.remove('visible'), 2600);
}

function actualizarBotonRotar() { $('btnRotar').textContent = controls.autoRotate ? 'Pausar giro' : 'Girar'; }

function marcarActiva() {

function seleccionar(i) {

// recorte circular de 500 m de la imagen satelital de cada sitio
async function dibujarMiniaturas() {
  for (let i = 0; i < SITIOS.length; i++) {
    const s = SITIOS[i], z = 16;
    try {
      const im = await mosaico(s.lat, s.lon, RADIO, z,
        (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`, false);
      const cx = lon2px(s.lon, z) - im.oX, cy = lat2px(s.lat, z) - im.oY;
      const mpp = 156543.03392 * Math.cos(s.lat * Math.PI / 180) / 2 ** z;
      const rp = RADIO / mpp;
      const g = miniaturas[i].cv.getContext('2d');
      g.save(); g.beginPath(); g.arc(70, 70, 70, 0, Math.PI * 2); g.clip();
      g.drawImage(im.canvas, cx - rp, cy - rp, 2 * rp, 2 * rp, 0, 0, 140, 140);
      g.restore();
      g.fillStyle = '#d64545'; g.beginPath(); g.arc(70, 70, 5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke();
    } catch (e) { console.warn('Miniatura sin imagen', s.nombre, e); }
  }
}

/* Alinea las imágenes históricas debajo de la navegación visible.
   Si StoryMaps usa ui=galeria y oculta la navegación lateral, se colocan
   debajo del título en el margen izquierdo. */
function posicionarTiempo() {
  const t = document.getElementById('tiempo');
  if (!t) return;
  if (window.innerWidth <= 640) {
    t.style.removeProperty('top');
    t.style.removeProperty('max-height');
    return;
  }
  const nav = document.getElementById('panel');
  const header = document.getElementById('cabecera');
  const gal = document.getElementById('galeria');
  const visible = el => el && getComputedStyle(el).display !== 'none' && el.getBoundingClientRect().height > 0;
  const top = visible(nav)
    ? Math.ceil(nav.getBoundingClientRect().bottom + 10)
    : Math.max(110, Math.ceil((visible(header) ? header.getBoundingClientRect().bottom : 98) + 12));
  const bottom = visible(gal) ? gal.getBoundingClientRect().top : window.innerHeight - 25;
  t.style.top = top + 'px';
  t.style.maxHeight = Math.max(70, Math.floor(bottom - top - 12)) + 'px';
}
window.addEventListener('resize', posicionarTiempo);
if (typeof ResizeObserver !== 'undefined') {
  const observer = new ResizeObserver(posicionarTiempo);
  observer.observe(document.getElementById('panel'));
  observer.observe(document.getElementById('cabecera'));
  observer.observe(document.getElementById('galeria'));
}

/* ---------- Imagen histórica (Esri World Imagery Wayback) ---------- */
let wbCfg = null;
const fechaPub = k => (wbCfg[k].itemTitle.match(/\d{4}-\d{2}-\d{2}/) || [''])[0];
async function cargarCfgWayback() {
  if (!wbCfg) {
    wbCfg = await (await fetch('https://s3-us-west-2.amazonaws.com/config.maptiles.arcgis.com/waybackconfig.json')).json();
    wbCfg._orden = Object.keys(wbCfg).filter(k => k !== '_orden').sort((a, b) => fechaPub(b).localeCompare(fechaPub(a)));
  }
  return wbCfg;
}
const tileXY = (lat, lon, z) => [Math.floor(lon2px(lon, z) / 256), Math.floor(lat2px(lat, z) / 256)];

// versiones en que la imagen del centro del sitio realmente cambió
async function versionesLocales(lat, lon) {
  const cfg = await cargarCfgWayback(), ks = cfg._orden, z = 17;
  const [x, y] = tileXY(lat, lon, z);
  const res = [];
  let i = 0;
  while (i < ks.length && res.length < 25) {
    const j = await (await fetch(`https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tilemap/${ks[i]}/${z}/${y}/${x}`)).json();
    if (!j.data || !j.data[0]) break;
    const sel = String(j.select && j.select[0] ? j.select[0] : ks[i]);
    if (!cfg[sel]) break;
    res.push(sel);
    i = Math.max(ks.indexOf(sel), i) + 1;
  }
  return res;
}

// fecha real de captura de la imagen en ese punto, según los metadatos de la versión
async function captura(rel, lat, lon) {
  const url = wbCfg[rel].metadataLayerUrl;
  if (!url) return null;
  const q = `/query?geometry=${lon},${lat}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=SRC_DATE,SRC_DATE2,SRC_RES,NICE_NAME,MinMapLevel,MaxMapLevel&returnGeometry=false&f=json`;
  const capas = await Promise.all([...Array(16).keys()].map(L =>
    fetch(url + '/' + L + q).then(r => r.json()).catch(() => null)));
  for (const c of capas) {
    const f = c && c.features && c.features[0];
    if (!f) continue;
    const a = f.attributes;
    if (a.MinMapLevel != null && (a.MinMapLevel > 17 || a.MaxMapLevel < 17)) continue;
    const t = a.SRC_DATE2 || a.SRC_DATE;
    if (!t) continue;
    return { fecha: new Date(typeof t === 'number' ? t : String(t)), fuente: a.NICE_NAME || '', res: a.SRC_RES };
  }
  return null;
}

const fmtFecha = d => d.toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', timeZone: 'UTC' });

async function prepararTiempo(sitio, mio) {
  const caja = $('tiempo'), anios = $('anios');
  anios.replaceChildren(); $('notaTiempo').textContent = 'Buscando imágenes anteriores…';
  caja.classList.remove('oculto');
  const vers = await versionesLocales(sitio.lat, sitio.lon);
  if (mio !== turno) return;
  const infos = await Promise.all(vers.map(v => captura(v, sitio.lat, sitio.lon).catch(() => null)));
  if (mio !== turno) return;
  // una opción por fecha de captura distinta; la más reciente es la imagen actual
  const vistos = new Set(), opciones = [];
  vers.forEach((v, i) => {
    const inf = infos[i];
    const clave = inf ? inf.fecha.toISOString().slice(0, 10) : 'pub' + fechaPub(v);
    if (vistos.has(clave)) return;
    vistos.add(clave);
    opciones.push({ rel: v, inf, actual: opciones.length === 0 });
  });
  opciones.reverse();
  if (opciones.length < 2) { $('notaTiempo').textContent = 'No hay imágenes anteriores distintas para este sitio.'; return; }
  for (const o of opciones) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = o.actual ? 'Actual' : (o.inf ? o.inf.fecha.getUTCFullYear() : fechaPub(o.rel).slice(0, 4) + '*');
    b.title = o.inf ? 'Capturada ' + fmtFecha(o.inf.fecha) + (o.inf.fuente ? ' (' + o.inf.fuente + ')' : '') : 'Fecha de captura no disponible; versión publicada ' + fechaPub(o.rel);
    b.addEventListener('click', () => usarVersion(o, b));
    o.boton = b;
    anios.appendChild(b);
  }
  const act = opciones[opciones.length - 1];
  modelo.wayback = { actual: true, texto: act.inf ? 'Imagen de ' + fmtFecha(act.inf.fecha) : '' };
  act.boton.classList.add('activo');
  notaTiempo(act);
  if (modelo.sitio) actualizarMeta(modelo.sitio);
  if (FECHA_INI && !prepararTiempo.usado) {
    prepararTiempo.usado = true;
    const objetivo = parseInt(FECHA_INI, 10);
    let mejor = null, dmin = Infinity;
    for (const o of opciones) {
      const a = o.inf ? o.inf.fecha.getUTCFullYear() : parseInt(fechaPub(o.rel), 10);
      if (Math.abs(a - objetivo) < dmin) { dmin = Math.abs(a - objetivo); mejor = o; }
    }
    if (mejor && !mejor.actual) usarVersion(mejor, mejor.boton);
  }
}

function notaTiempo(o) {
  $('notaTiempo').textContent = o.inf
    ? 'Capturada ' + fmtFecha(o.inf.fecha) + (o.inf.res ? ` · ${(+o.inf.res).toFixed(1)} m/píxel` : '') + (o.actual ? '' : ' · edificios de 2026 en transparencia')
    : 'Versión publicada ' + fechaPub(o.rel) + ' (fecha de captura no disponible)';
}

let turnoImg = 0;
async function usarVersion(o, boton) {
  if (!modelo) return;
  const mio = ++turnoImg, sitio = modelo.sitio;
  [...$('anios').children].forEach(b => b.classList.toggle('activo', b === boton));
  $('notaTiempo').textContent = 'Descargando imagen…';
  try {
    const url = o.actual
      ? (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`
      : (z, x, y) => wbCfg[o.rel].itemURL.replace('{level}', z).replace('{row}', y).replace('{col}', x);
    const im = await mosaico(sitio.lat, sitio.lon, RADIO, Z_IMG, url, false);
    if (mio !== turnoImg || !modelo || modelo.sitio !== sitio) return;
    if (im.oX !== modelo.img.oX || im.oY !== modelo.img.oY || im.W !== modelo.img.W) throw new Error('Mosaico distinto');
    const tex = new THREE.CanvasTexture(im.canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const mat = modelo.sup.material;
    const vieja = mat.map; mat.map = tex; mat.needsUpdate = true;
    if (vieja && vieja !== modelo.texImg) vieja.dispose();
    modelo.wayback = { actual: o.actual, texto: o.inf ? 'Imagen de ' + fmtFecha(o.inf.fecha) : 'Imagen publicada ' + fechaPub(o.rel) };
    construirMallaEdif();
    notaTiempo(o);
    actualizarMeta(sitio);
  } catch (e) {
    console.error(e);
    $('notaTiempo').textContent = 'No se pudo cargar esa imagen.';
  }
}

    const [dem, img] = await Promise.all([
      mosaico(sitio.lat, sitio.lon, RADIO, Z_DEM,
        (z, x, y) => `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`, true),
      mosaico(sitio.lat, sitio.lon, RADIO, Z_IMG,
        (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`, false)
    ]);
    if (mio !== turno) return;
    if (grupo) { scene.remove(grupo); liberar(grupo); grupo = null; modelo = null; }
    construir(sitio, dem, img);
    dibujarMini(sitio);
    turnoImg++;
    if (!document.body.classList.contains('sin-tiempo') && UI !== 'none') prepararTiempo(sitio, mio).catch(e => { console.warn(e); $('tiempo').classList.add('oculto'); });
    vistaInicial();
    carga.classList.add('oculto');
    if (dem.fallos || img.fallos) aviso('Algunas teselas no cargaron; puede haber huecos.');
    if (verEdif) cargarEdificios(sitio, mio).catch(e => {
      console.error(e);
      if (mio === turno) { aviso('No se pudieron cargar los edificios'); if (modelo) { modelo.edif = { lista: [], version: '', conAltura: 0 }; actualizarMeta(sitio); } }
    });
  } catch (e) {
    if (mio !== turno) return;
    carga.classList.add('error');
    $('cargaTxt').textContent = 'No se pudo cargar el terreno: ' + e.message;
    console.error(e);
  }
}

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
cargar(sitioLibre || SITIOS[sitioIdx]).then(() => { if (!sitioLibre && (UI === 'full' || UI === 'galeria')) dibujarMiniaturas(); });
</script>
</body>
</html>
