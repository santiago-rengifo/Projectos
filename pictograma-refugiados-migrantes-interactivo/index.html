<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Pictograma interactivo con 15 personas ilustradas que saludan al tocarlas; cada figura representa 1.000 personas refugiadas y migrantes.">
  <title>15.000 refugiados y migrantes · Pictograma interactivo</title>
  <style>
    :root {
      color-scheme:light;
      --blue:#0072BC;
      --deep:#004F83;
      --text:#152B3B;
      --sub:#577084;
      --shirt:#0072BC;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;width:100%;background:#fff}
    body{font-family:Arial,Helvetica,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
    .wrap{width:100%;max-width:850px;margin:0 auto;padding:clamp(15px,2.8vw,26px) clamp(12px,3vw,27px) 23px}
    h1{text-align:center;margin:0;font-size:clamp(21px,3.6vw,35px);line-height:1.15;letter-spacing:-.025em;font-weight:800}
    h1 .amount{color:var(--deep)}
    .legend{
      display:flex;justify-content:center;align-items:center;gap:10px;
      margin:6px auto 12px;line-height:1.3;font-size:clamp(14px,2vw,18px);
      font-weight:500;
    }
    .legend strong{color:var(--deep);font-weight:800}
    .legend-icon{width:43px;height:63px;flex:0 0 43px}
    .grid{max-width:670px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(5px,1.9vw,18px);align-items:center;justify-items:center}
    .person{--shirt:var(--blue);display:grid;place-items:center;width:100%;min-width:0;margin:0;padding:0;border:0;background:transparent;border-radius:18px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;transition:background .2s ease}
    .person:nth-child(5n+2){--shirt:#1385C5}
    .person:nth-child(5n+4){--shirt:#006BA9}
    .person:nth-child(5n+5){--shirt:#258FCB}
    .character{display:block;width:clamp(54px,10.5vw,92px);height:auto;overflow:visible}
    .glow{fill:#E9F6FD;opacity:.75;transition:fill .2s ease,opacity .2s ease}
    .ground{fill:#D3E7F5}
    .stroke-limb{fill:none;stroke:#006DAF;stroke-linecap:round;stroke-linejoin:round;stroke-width:10.5}
    .shoe{fill:none;stroke:var(--deep);stroke-width:6.5;stroke-linecap:round}
    .shirt{fill:var(--shirt)}
    .face{fill:#3CA5D8}
    .hair{fill:var(--deep)}
    .hand{fill:#006DAF}
    .neck{fill:none;stroke:#3CA5D8;stroke-width:7;stroke-linecap:round}
    .collar{fill:none;stroke:#D5F1FF;stroke-width:2.8;stroke-linecap:round}
    .eye{fill:#123C57}
    .smile{fill:none;stroke:#123C57;stroke-width:1.7;stroke-linecap:round}
    .head{transform-origin:49px 42px}
    .dancer{transform-origin:49px 122px}
    .right-arm{transform-origin:63px 61px}
    .sparkles{fill:none;stroke:#3AADE6;stroke-width:3.4;stroke-linecap:round;opacity:0;transform-origin:80px 22px}
    .person:hover .glow,.person:focus-visible .glow{fill:#D5EFFF;opacity:1}
    .person:hover .dancer{transform:translateY(-3px)}
    .person:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
    .person.animating .dancer{animation:bounce 1.05s cubic-bezier(.17,.76,.23,1) both}
    .person.animating .right-arm{animation:wave 1.05s ease-in-out both}
    .person.animating .head{animation:nod 1.05s ease-in-out both}
    .person.animating .sparkles{animation:spark 1.05s ease-out both}
    .person.animating .glow{animation:pulse 1.05s ease-out both}
    @keyframes bounce{
      0%,100%{transform:translateY(0)}
      16%,49%{transform:translateY(-8px)}
      33%{transform:translateY(-3px)}
      68%{transform:translateY(-6px)}
      83%{transform:translateY(0)}
    }
    @keyframes wave{
      0%,100%{transform:rotate(0deg)}
      16%{transform:rotate(-130deg)}
      30%{transform:rotate(-98deg)}
      44%{transform:rotate(-134deg)}
      58%{transform:rotate(-99deg)}
      74%{transform:rotate(-125deg)}
      88%{transform:rotate(-35deg)}
    }
    @keyframes nod{0%,100%{transform:rotate(0)}38%{transform:rotate(-8deg)}68%{transform:rotate(5deg)}}
    @keyframes spark{0%,10%,95%,100%{opacity:0;transform:scale(.6)}25%,70%{opacity:1;transform:scale(1)}}
    @keyframes pulse{0%,100%{transform:scale(1);transform-origin:49px 73px}45%{transform:scale(1.13);fill:#CDEEFF}80%{transform:scale(1.04)}}
    .foot{text-align:center;margin:13px 0 0;color:var(--sub);font-size:12px;line-height:1.4}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:440px){
      .wrap{padding:13px 8px 18px}
      h1{font-size:clamp(19px,5vw,24px)}
      .legend{font-size:clamp(12px,3.3vw,16px);margin:5px auto 9px;gap:6px}
      .legend-icon{width:36px;height:54px;flex-basis:36px}
      .character{width:clamp(47px,12vw,60px)}
      .grid{gap:5px 1px}
      .foot{font-size:11px}
    }
    @media(max-width:300px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.character{width:57px}}
    @media(prefers-reduced-motion:reduce){
      .person:hover .dancer{transform:none}
      .person.animating .dancer,.person.animating .right-arm,.person.animating .head,.person.animating .sparkles,.person.animating .glow{animation:none!important}
      .person.animating .glow{fill:#CDEEFF}
    }
  </style>
</head>

    <span class="sr" id="live" role="status" aria-live="polite"></span>
  </main>
  <script>
  "use strict";
  const grid=document.querySelector(".grid");
  const live=document.getElementById("live");
  grid.addEventListener("click",event=>{
    const button=event.target.closest(".person");
    if(!button||!grid.contains(button))return;
    button.classList.remove("animating");
    void button.offsetWidth;
    button.classList.add("animating");
    live.textContent="La figura está saludando.";
  });
  grid.addEventListener("animationend",event=>{
    if(event.animationName!=="bounce")return;
    const button=event.target.closest(".person");
    if(button)button.classList.remove("animating");
  });
  </script>
