<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="15.000 personas refugiadas y migrantes representadas con 15 pictogramas azules. Toca las figuras para verlas saludar.">
  <title>15.000 refugiados y migrantes · Pictograma animado</title>
  <style>
    :root { color-scheme: light; --person-blue: #338ec9; --ink: #151f29; --hint: #5b7083; }
    * { box-sizing: border-box; }
    html, body { width: 100%; margin: 0; background: #fff; }
    body { font-family: Arial, Helvetica, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    main { max-width: 770px; margin: 0 auto; padding: clamp(14px,2.8vw,26px) clamp(12px,2.7vw,28px) clamp(12px,2.8vw,22px); }
    h1 { margin: 0; text-align: center; font-size: clamp(20px,3.45vw,32px); line-height: 1.2; letter-spacing: -.022em; font-weight: 750; }
    .legend { display:flex; justify-content:center; align-items:center; gap: 10px; margin: 12px auto 15px; font-size: clamp(14px,2.25vw,18px); line-height: 1.3; }
    .legend .human { width: 35px; height: 56px; flex: 0 0 35px; }
    .grid { max-width: 600px; width: 100%; margin: 0 auto; display:grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: clamp(9px,2.1vw,19px) clamp(6px,2.2vw,18px); justify-items:center; align-items:center; }
    .icon-button { display:flex; align-items:center; justify-content:center; appearance:none; border:0; background:transparent; border-radius:11px; width:100%; padding:1px; margin:0; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    .human { display:block; width: clamp(46px,9.4vw,71px); height:auto; overflow:visible; color:var(--person-blue); }
    .head, .torso { fill:currentColor; }
    .legs, .raised-arm { fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; }
    .legs { stroke-width:5.5; }
    .raised-arm { stroke-width:6.3; transform-box:view-box; transform-origin:37px 31.8px; }
    .person-core { transform-box:view-box; transform-origin:29px 56px; }
    .icon-button:focus-visible { outline:3px solid var(--person-blue); outline-offset:3px; }
    .icon-button:active .person-core { transform:translateY(-2px); }
    .icon-button.waving .person-core { animation:body-bob .95s ease-in-out both; }
    .icon-button.waving .raised-arm { animation:arm-wave .95s ease-in-out both; }
    @keyframes body-bob {
      0%,100% { transform: translateY(0) rotate(0); }
      22% { transform: translateY(-4px) rotate(-2deg); }
      47% { transform: translateY(-1px) rotate(1.5deg); }
      72% { transform: translateY(-3px) rotate(-1deg); }
    }
    @keyframes arm-wave {
      0%,100% { transform:rotate(0deg); }
      18% { transform:rotate(14deg); }
      36% { transform:rotate(-13deg); }
      53% { transform:rotate(15deg); }
      72% { transform:rotate(-11deg); }
      88% { transform:rotate(6deg); }
    }
    .hint { margin: 16px 0 0; text-align:center; color:var(--hint); font-size:12px; line-height:1.4; }
    @media (max-width:420px) {
      main { padding: 14px 8px 17px; }
      h1 { font-size:clamp(19px,5vw,24px); }
      .legend { gap:7px; margin:9px auto 12px; font-size:clamp(12px,3.5vw,15px); }
      .legend .human { width:31px; height:49px; flex-basis:31px; }
      .human { width:clamp(38px,11.7vw,56px); }
      .grid { gap:7px 3px; }
      .hint { font-size:11px; }
    }
    @media (max-width:300px) { .grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .human { width:52px; } }
    @media (prefers-reduced-motion:reduce) {
      .icon-button:active .person-core { transform:none; }
      .icon-button.waving .person-core,.icon-button.waving .raised-arm { animation:none!important; }
    }
  </style>
</head>

  <script>
    "use strict";
    const grid = document.querySelector(".grid");
    grid.addEventListener("click", (event) => {
      const b=event.target.closest("button.icon-button");
      if(!b || !grid.contains(b)) return;
      b.classList.remove("waving");
      void b.offsetWidth;
      b.classList.add("waving");
    });
    grid.addEventListener("animationend", (event) => {
      if(event.animationName!=="body-bob") return;
      const button=event.target.closest("button.icon-button");
      if(button) button.classList.remove("waving");
    });
  </script>
