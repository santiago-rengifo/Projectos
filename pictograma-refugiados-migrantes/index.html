<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Pictograma interactivo de 15.000 refugiados y migrantes, con figuras animadas que saludan al tocarlas.">
<title>15.000 refugiados y migrantes · Pictograma interactivo</title>
<style>
  :root {
    color-scheme: light;
    --acnur: #0072bc;
    --acnur-oscuro: #075785;
    --tinta: #172a3b;
    --suave: #536c80;
    --halo: #e7f5ff;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; margin: 0; background: #fff; }
  body { font-family: Arial, Helvetica, sans-serif; color: var(--tinta); -webkit-font-smoothing: antialiased; }
  main {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    padding: clamp(15px,3vw,29px) clamp(12px,3vw,32px) clamp(15px,3vw,24px);
  }
  h1 { margin: 0; text-align: center; font-size: clamp(21px,3.5vw,34px); letter-spacing: -.025em; line-height: 1.16; font-weight: 750; }
  h1 strong { color: var(--acnur-oscuro); font-weight: 800; }
  .leyenda { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 11px auto 12px; font-size: clamp(13px,2vw,18px); font-weight: 500; line-height: 1.3; }
  .leyenda strong { color: var(--acnur-oscuro); font-weight: 800; }
  .legend-svg { display: block; width: 39px; height: 59px; flex: 0 0 39px; color: var(--acnur); }
  .figuras {
    max-width: 670px;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    justify-items: center;
    align-items: center;
    gap: clamp(8px,1.5vw,16px) clamp(4px,1.5vw,15px);
    margin: 0 auto;
  }
  .person {
    appearance: none;
    display: grid;
    place-items: center;
    width: 100%;
    min-width: 0;
    border: 0;
    border-radius: 14px;
    margin: 0;
    padding: 2px 0;
    background: transparent;
    color: var(--acnur);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .figure-svg { display: block; width: clamp(47px,10vw,83px); height: auto; overflow: visible; }
  .halo { fill: var(--halo); opacity: .56; transition: opacity .2s ease, fill .2s ease; }
  .ground-shadow { fill: #b3d4e8; opacity: .65; }
  .torso, .head { fill: currentColor; }
  .limb, .neck { stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .limb { stroke-width: 10.5; }
  .neck { stroke-width: 8; }
  .body-pose { transform-origin: 46px 85px; }
  .wave-arm { transform-origin: 70px 51px; }
  .person:hover .halo, .person:focus-visible .halo { opacity: .95; fill: #d4eeff; }
  .person:hover .body-pose { transform: translateY(-3px); }
  .person:focus-visible { outline: 3px solid var(--acnur); outline-offset: 2px; }
  .person.playing .body-pose { animation: person-saludo .82s cubic-bezier(.24,.7,.22,1) both; }
  .person.playing .wave-arm { animation: mano-saludo .82s ease-in-out both; }
  .person.playing .halo { animation: halo-saludo .82s ease-out both; }
  .person.playing .ground-shadow { animation: sombra-saludo .82s ease-out both; }
  @keyframes person-saludo {
    0%,100% { transform: translateY(0) rotate(0); }
    18% { transform: translateY(-10px) rotate(-3deg); }
    38% { transform: translateY(-4px) rotate(3deg); }
    56% { transform: translateY(-8px) rotate(-2deg); }
    78% { transform: translateY(0) rotate(1deg); }
  }
  @keyframes mano-saludo {
    0%,100% { transform: rotate(0); }
    16%,50% { transform: rotate(-20deg); }
    33%,67% { transform: rotate(16deg); }
    80% { transform: rotate(-8deg); }
  }
  @keyframes halo-saludo {
    0%,100% { opacity: .56; transform: scale(1); transform-origin: 46px 68px; }
    35% { opacity: 1; transform: scale(1.08); }
    67% { opacity: .8; transform: scale(1.04); }
  }
  @keyframes sombra-saludo {
    0%,100% { opacity: .65; transform: scaleX(1); transform-origin: 46px 129px; }
    28% { opacity: .32; transform: scaleX(.75); }
  }
  .indicacion { margin: 11px 0 0; text-align: center; font-size: 12px; color: var(--suave); line-height: 1.4; }
  @media (max-width: 440px) {
    main { padding: 13px 9px 18px; }
    h1 { font-size: clamp(18px,5vw,24px); }
    .leyenda { gap: 7px; margin: 8px auto 8px; font-size: clamp(12px,3.4vw,15px); }
    .legend-svg { width: 34px; height: 51px; flex-basis: 34px; }
    .figure-svg { width: clamp(40px,12vw,55px); }
    .figuras { gap: 6px 2px; }
  }
  @media (max-width: 300px) {
    .figuras { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .figure-svg { width: 52px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .person:hover .body-pose { transform: none; }
    .person.playing .body-pose,
    .person.playing .wave-arm,
    .person.playing .halo,
    .person.playing .ground-shadow { animation: none !important; }
    .person.playing .halo { fill: #b9e6ff; opacity: 1; }
  }
</style>

<script>
  "use strict";
  const figuras = document.querySelector(".figuras");
  figuras.addEventListener("click", (event) => {
    const boton = event.target.closest("button.person");
    if (!boton || !figuras.contains(boton)) return;
    // Reinicia la animación en cada toque, incluso si se repite rápidamente.
    boton.classList.remove("playing");
    void boton.offsetWidth;
    boton.classList.add("playing");
  });
  figuras.addEventListener("animationend", (event) => {
    if (event.animationName !== "person-saludo") return;
    const boton = event.target.closest("button.person");
    if (boton) boton.classList.remove("playing");
  });
</script>
