<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Servicios</title>
<style>
:root{
  --bg:#eef1f3;
  --blue:#0b79be;
  --ink:#111;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.wrap{width:100%;padding:34px 22px 28px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:42px;align-items:start;max-width:1200px;margin:0 auto}
.item{text-align:center;min-width:0}
.icon-circle{width:108px;height:108px;margin:0 auto 18px;border-radius:50%;background:var(--blue);display:grid;place-items:center;transition:transform .18s ease}
.item:hover .icon-circle{transform:translateY(-3px)}
.icon-circle svg{width:68px;height:68px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:1.05rem;line-height:1.25;max-width:230px;margin:0 auto}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 24px}.icon-circle{width:100px;height:100px}.icon-circle svg{width:62px;height:62px}}
@media(max-width:480px){.wrap{padding:26px 14px}.grid{grid-template-columns:1fr;gap:28px}.icon-circle{width:96px;height:96px;margin-bottom:14px}.label{font-size:1rem}}
@media(prefers-reduced-motion:reduce){.icon-circle{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <section class="grid" aria-label="Servicios">

    <article class="item">
      <div class="icon-circle" aria-hidden="true">
        <svg viewBox="0 0 80 80">
          <path d="M14 58h52"/>
          <path d="M26 58V36h22v22"/>
          <path d="M33 36V22h8v14"/>
          <path d="M37 22v-6"/>
          <path d="M55 30h9"/>
          <path d="M59.5 30v8"/>
          <path d="M53 38c0 6 13 6 13 0"/>
          <path d="M20 29h9"/>
          <path d="M24.5 29v8"/>
          <path d="M18 37c0 6 13 6 13 0"/>
          <rect x="31" y="43" width="12" height="15" rx="2"/>
        </svg>
      </div>
      <p class="label">Saneamiento básico<br>y agua</p>
    </article>

    <article class="item">
      <div class="icon-circle" aria-hidden="true">
        <svg viewBox="0 0 80 80">
          <circle cx="43" cy="29" r="10"/>
          <path d="M34 29h18"/>
          <path d="M38 22h10"/>
          <path d="M33 44c3-7 17-7 20 0v14H33z"/>
          <path d="M21 57V46c0-5 4-9 9-9"/>
          <circle cx="22" cy="33" r="5"/>
          <path d="M17 47l-7 7"/>
          <path d="M52 18h10l4 8H52"/>
          <path d="M55 15h7"/>
          <path d="M43 46v12"/>
          <path d="M37 52h12"/>
        </svg>
      </div>
      <p class="label">Medios de vida</p>
    </article>

    <article class="item">
      <div class="icon-circle" aria-hidden="true">
        <svg viewBox="0 0 80 80">
          <path d="M35 21h22v37H35z"/>
          <path d="M35 28H24v20h11"/>
          <path d="M18 34l6-6"/>
          <circle cx="21" cy="52" r="8"/>
          <path d="M21 40v4M21 60v4M9 52h4M29 52h4M13 44l3 3M26 57l3 3M13 60l3-3M26 47l3-3"/>
          <path d="M47 28v18"/>
          <path d="M53 25c5 3 8 7 8 12"/>
          <path d="M56 19c8 4 13 10 13 18"/>
        </svg>
      </div>
      <p class="label">Servicios públicos</p>
    </article>

    <article class="item">
      <div class="icon-circle" aria-hidden="true">
        <svg viewBox="0 0 80 80">
          <path d="M14 31h52v29H14z"/>
          <path d="M21 31v-8h38v8"/>
          <path d="M31 23v-6h18v6"/>
          <circle cx="40" cy="24" r="5"/>
          <path d="M40 20v8M36 24h8"/>
          <path d="M22 39h8v8h-8zM36 39h8v8h-8zM50 39h8v8h-8z"/>
          <path d="M22 52h8v8M50 52h8v8"/>
          <path d="M36 52h8v8h-8z"/>
          <path d="M14 35H9v25h5M66 35h5v25h-5"/>
        </svg>
      </div>
      <p class="label">Servicio médico y escuela</p>
    </article>

  </section>
</main>
</body>
</html>
